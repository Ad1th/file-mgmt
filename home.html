<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloudify - My Drive</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="header-left">
          <button id="toggle-sidebar" class="mobile-only">
            <i class="fas fa-bars"></i>
          </button>
          <div class="logo">
            <i class="fas fa-cloud"></i>
            <span>Cloudify</span>
          </div>
        </div>
        <div class="search-bar">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search in Drive" />
        </div>
        <div class="header-right">
          <button id="upload-btn" class="primary-btn">
            <i class="fas fa-upload"></i>
            <span>Upload</span>
          </button>
          <input type="file" id="file-upload" multiple style="display: none" />
        </div>
      </header>

      <div class="main-content">
        <aside class="sidebar">
          <nav>
            <ul>
              <li class="active"><i class="fas fa-hdd"></i> My Drive</li>
              <li><i class="fas fa-clock"></i> Recent</li>
              <li><i class="fas fa-users"></i> Shared with me</li>
              <li><i class="fas fa-star"></i> Starred</li>
              <li><i class="fas fa-trash"></i> Trash</li>
            </ul>
          </nav>
          <div class="storage-info">
            <div class="storage-header">
              <i class="fas fa-cloud"></i>
              <span>Storage</span>
            </div>
            <div class="storage-bar">
              <div class="storage-used"></div>
            </div>
            <p class="storage-text">0 GB of 15 GB used</p>
          </div>
        </aside>

        <main>
          <div class="actions">
            <button id="create-folder-btn">
              <i class="fas fa-folder-plus"></i> New Folder
            </button>
          </div>

          <div class="breadcrumb">
            <span id="current-path">My Drive</span>
          </div>

          <div class="files-container" id="files-container">
            <!-- Files and folders will be loaded here -->
            <div class="loading">Loading files...</div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>

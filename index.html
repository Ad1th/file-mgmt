<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google Drive Clone</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="drive-container">
      <!-- Header -->
      <header class="header">
        <div class="header-content">
          <button id="menu-toggle" class="menu-button">
            <i class="fas fa-bars"></i>
          </button>
          <div class="logo">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 87.3 78"
              class="drive-logo"
            >
              <path
                d="M6.6 66.85l3.85 6.65c.8 1.4 1.95 2.5 3.3 3.3l13.75-23.8H0c0 1.55.4 3.1 1.2 4.5l5.4 9.35z"
                fill="#0066da"
              />
              <path
                d="M43.65 25L29.9 1.2c-1.35.8-2.5 1.9-3.3 3.3l-25.4 44a9.06 9.06 0 0 0-1.2 4.5h27.5l16.15-28z"
                fill="#00ac47"
              />
              <path
                d="M73.55 76.8c1.35-.8 2.5-1.9 3.3-3.3l1.6-2.75 7.65-13.25c.8-1.4 1.2-2.95 1.2-4.5H59.8L73.55 76.8z"
                fill="#ea4335"
              />
              <path
                d="M43.65 25L57.4 1.2C56.05.4 54.5 0 52.85 0H34.45c-1.65 0-3.2.4-4.55 1.2L43.65 25z"
                fill="#00832d"
              />
              <path
                d="M59.8 53H27.45L13.7 76.8c1.35.8 2.9 1.2 4.55 1.2h50.6c1.65 0 3.2-.4 4.55-1.2L59.8 53z"
                fill="#2684fc"
              />
              <path
                d="M73.4 26.5l-12.7-22c-.8-1.4-1.95-2.5-3.3-3.3L43.65 25 59.8 53h27.5c0-1.55-.4-3.1-1.2-4.5l-12.7-22z"
                fill="#ffba00"
              />
            </svg>
            <h1>Drive</h1>
          </div>
          <div class="search-container">
            <div class="search-icon">
              <i class="fas fa-search"></i>
            </div>
            <input
              type="text"
              placeholder="Search in Drive"
              class="search-input"
            />
          </div>
          <button class="upload-button">
            <i class="fas fa-upload"></i>
            <span class="upload-text">Upload</span>
          </button>
        </div>
      </header>

      <!-- Main content -->
      <div class="main-container">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-content">
            <div class="sidebar-header mobile-only">
              <h2>Drive Menu</h2>
              <button id="close-sidebar" class="close-button">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <div class="nav-items">
              <button class="nav-button active">
                <i class="fas fa-hdd"></i>
                My Drive
              </button>
              <button class="nav-button">
                <i class="fas fa-clock"></i>
                Recent
              </button>
              <button class="nav-button">
                <i class="fas fa-users"></i>
                Shared with me
              </button>
              <button class="nav-button">
                <i class="fas fa-star"></i>
                Starred
              </button>
              <button class="nav-button">
                <i class="fas fa-trash"></i>
                Trash
              </button>
            </div>
            <div class="storage-section">
              <div class="storage-item">
                <div class="storage-header">
                  <i class="fas fa-cloud"></i>
                  <span>Storage</span>
                </div>
                <div class="storage-details">
                  <div class="storage-bar">
                    <div class="storage-used"></div>
                  </div>
                  <p class="storage-text">7.2 GB of 15 GB used</p>
                </div>
              </div>
            </div>
          </div>
        </aside>

        <!-- Main content area -->
        <main class="content">
          <div class="file-section">
            <h2>My Drive</h2>
            <div id="my-drive-files" class="file-grid"></div>
          </div>

          <div class="file-section">
            <h2>Recent</h2>
            <div id="recent-files" class="file-grid"></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Mobile overlay -->
    <div id="sidebar-overlay" class="overlay"></div>

    <!-- File context menu (dropdown) template -->
    <div id="context-menu-template" class="context-menu" style="display: none">
      <ul>
        <li>Rename</li>
        <li>Download</li>
        <li>Share</li>
        <li class="delete-option">Delete</li>
      </ul>
    </div>

    <!-- File upload input (hidden) -->
    <input type="file" id="file-upload" multiple style="display: none" />

    <script src="app.js"></script>
  </body>
</html>
